services:
  tailscale:
    image: tailscale/tailscale:stable
    container_name: tailscale
    hostname: n8n-compose-ts
    restart: unless-stopped
    cap_add:
      - net_admin
      - sys_module
    env_file:
      - .env
    environment:
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false
      - TS_EXTRA_ARGS=--accept-routes --advertise-routes=10.51.0.0/24
      - TS_AUTHKEY=${TS_AUTHKEY}
    volumes:
      - tailscale_data:/var/lib/tailscale
    networks:
      tailscale_network:
        ipv4_address: 10.51.0.10

  https-portal:
    image: steveltn/https-portal:1
    container_name: https-portal
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    env_file:
      - .env
    environment:
      - DOMAINS
      - STAGE
      - CLIENT_MAX_BODY_SIZE
    volumes:
      - https_portal_data:/var/lib/https-portal
    networks:
      - default
      - tailscale_network

  n8n:
    build: .
    container_name: n8n
    restart: unless-stopped
    depends_on:
      - tailscale
    env_file:
      - .env
    environment:
      - GENERIC_TIMEZONE=Asia/Tokyo
      - N8N_COMMUNITY_NODES_ENABLED=true
      - N8N_ENCRYPTION_KEY
      - N8N_HOST
      - N8N_SECURE_COOKIE
    ports:
      - 5678:5678
    volumes:
      - n8n_data:/home/node/.n8n
      - ./add-route.sh:/add-route.sh:ro
      - ./files:/home/node/files
      - ./local-files:/tmp/local-files
    cap_add:
      - NET_ADMIN
    networks:
      default:
      tailscale_network:
        ipv4_address: 10.51.0.12
volumes:
  n8n_data:
  https_portal_data:
  tailscale_data:

networks:
  default:
    driver: bridge
  tailscale_network:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 10.51.0.0/24
          gateway: 10.51.0.1
