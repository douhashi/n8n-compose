services:
  https-portal:
    image: steveltn/https-portal:1
    container_name: https-portal
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    env_file:
      - .env
    environment:
      - DOMAINS
      - STAGE
      - CLIENT_MAX_BODY_SIZE
    volumes:
      - https_portal_data:/var/lib/https-portal
    networks:
      - n8n_network

  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - GENERIC_TIMEZONE=Asia/Tokyo
      - N8N_COMMUNITY_NODES_ENABLED=true
      - N8N_ENCRYPTION_KEY
      - N8N_HOST
      - N8N_SECURE_COOKIE
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - n8n_network
volumes:
  n8n_data:
  https_portal_data:

networks:
  n8n_network:
    driver: bridge
